<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Cleanup Nepal - Submit Cleanup</title>
</head>

<body>
    <div class="cleanup-container">
        <h1>Submit Cleanup</h1>
        <form id="cleanupForm">
            <label>Before Photo</label>
            <input type="file" id="beforePhoto" required>
            <label>After Photo</label>
            <input type="file" id="afterPhoto" required>
            <button type="submit">Submit</button>
        </form>
        <p id="cleanup-msg" class="success"></p>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
